# Configurar DP-1 como monitor principal (posición 0x0)
monitor = DP-1,1920x1080@165,0x0,1

# Segundo monitor a la izquierda
# monitor = DP-2,1920x1080@60,-1920x0,1

# Segundo monitor en medio
monitor = DP-2,1920x1080@75,1920x0,1

# Monitor Terciario (El  portatil)
# monitor = HDMI-A-1,1920x1080@60,1920x0,1,transform,1
monitor = HDMI-A-1,1920x1080@60,3840x0,1,transform,1
# monitor = HDMI-A-1,1920x1080@60,1920x0,1
# monitor = HDMI-A-1,1920x1080@60,0x1080,1,transform,2
# monitor = HDMI-A-1,1920x1080@60,1920x0,1


# Haciendo Mirror
# ------------------------------------
#     DP-3 como espejo de DP-1
# ------------------------------------
# monitor = DP-3,1920x1080@60,0x0,1,mirror,DP-1

# Vincular el workspace 1 al monitor DP-3
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2
workspace = 11, monitor:DP-1
workspace = 12, monitor:DP-1
workspace = 13, monitor:DP-1
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-1
workspace = 16, monitor:HDMI-A-1
workspace = 17, monitor:HDMI-A-1
workspace = 18, monitor:HDMI-A-1
workspace = 19, monitor:HDMI-A-1
workspace = 20, monitor:HDMI-A-1
