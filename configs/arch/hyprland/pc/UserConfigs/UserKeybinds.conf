####################
### KEYBINDINGSS ###
####################

#$terminal = /opt/kitty/bin/kitty
$terminal = kitty
$menu = rofi -show drun

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = ALT # Sets "ALT" key as main modifier
$secMOD = SUPER # Sets "Win" key as second modifier

$scriptsDir = $HOME/.config/hypr/scripts/
# $UserConfigs = $HOME/.config/hypr/UserConfigs/

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod shift, space, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, O, layoutmsg, togglesplit, # dwindle
bind = $mainMod, O, exec, hyprctl dispatch layoutmsg togglesplit 
bind = $secMOD SHIFT, ESCAPE, exec, kitty --class btop-popup --title btop btop
bind = $secMOD SHIFT, Q, exit,
bind = $secMOD SHIFT, w, exec, $scriptsDir/waybar_launch.sh
bind = $secMOD, H, exec, hyprpicker -a
bind = $secMOD, L, exec, hyprlock
bind = $secMOD, F, fullscreen, 0
bind = $secMOD, slash, exec, eww open --toggle cheatsheet-popup
bind = $secMOD, S, exec, eww open --toggle spotify-popup
bind = $secMOD, Z, exec, zen-browser
bind = $secMOD, D, exec, /opt/Discord/discord


# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move window in a given direction
bind = $mainMod shift, h, movewindow, l
bind = $mainMod shift, l, movewindow, r
bind = $mainMod shift, k, movewindow, u
bind = $mainMod shift, j, movewindow, d

# Resize window
bind = $mainMod, right, resizeactive, 10 0
bind = $mainMod, left, resizeactive, -10 0
bind = $mainMod, up, resizeactive, 0 -10
bind = $mainMod, down, resizeactive, 0 10

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT CTRL, 1, movetoworkspace, 11
bind = $mainMod SHIFT CTRL, 2, movetoworkspace, 12
bind = $mainMod SHIFT CTRL, 3, movetoworkspace, 13
bind = $mainMod SHIFT CTRL, 4, movetoworkspace, 14
bind = $mainMod SHIFT CTRL, 5, movetoworkspace, 15
bind = $mainMod SHIFT CTRL, 6, movetoworkspace, 16
bind = $mainMod SHIFT CTRL, 7, movetoworkspace, 17
bind = $mainMod SHIFT CTRL, 8, movetoworkspace, 18
bind = $mainMod SHIFT CTRL, 9, movetoworkspace, 19
bind = $mainMod SHIFT CTRL, 0, movetoworkspace, 20

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, s, workspace, e+1
bind = $mainMod, a, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# move floating window
binde = $mainMod SUPER, left, moveactive, -10 0
binde = $mainMod SUPER, right, moveactive, 10 0
binde = $mainMod SUPER, up, moveactive, 0 -10
binde = $mainMod SUPER, down, moveactive, 0 10
